{% extends "base.html" %}
{% block content %}
<h3>Virtual Classroom: {{ lesson.title }}</h3>

{% if lesson.video_url %}
<div class="ratio ratio-16x9 mb-4">
    <iframe src="{{ lesson.video_url }}" allowfullscreen></iframe>
</div>
{% endif %}

<div class="card shadow-sm">
    <div class="card-body">
        <h5>Live Chat</h5>
        <div id="chat-box" class="border rounded p-3 mb-3" style="height: 260px; overflow-y: auto;"></div>
        <form id="chat-form">
            {% csrf_token %}
            <div class="input-group">
                <input type="text" id="message-input" class="form-control" placeholder="Type your message..." required>
                <button class="btn btn-primary" type="submit">Send</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const lessonId = {{ lesson.id }};
const chatBox = document.getElementById('chat-box');
const messageInput = document.getElementById('message-input');
const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

async function loadMessages() {
  const res = await fetch(`/api/chat/${lessonId}/`);
  if (!res.ok) return;
  const data = await res.json();
  chatBox.innerHTML = data.map(m => `
    <div class="mb-2">
      <strong>${m.username}</strong>:
      <span>${m.message}</span>
      <small class="text-muted d-block">${new Date(m.timestamp).toLocaleString()}</small>
    </div>
  `).join('');
  chatBox.scrollTop = chatBox.scrollHeight;
}

document.getElementById('chat-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = messageInput.value.trim();
  if (!message) return;
  await fetch(`/api/chat/${lessonId}/`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken},
    body: JSON.stringify({message})
  });
  messageInput.value = '';
  loadMessages();
});

loadMessages();
setInterval(loadMessages, 3000);
</script>
{% endblock %}
