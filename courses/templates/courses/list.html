{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Courses</h2>
    <form method="get" class="d-flex gap-2">
        <select name="level" class="form-select">
            <option value="">All Levels</option>
            <option value="beginner" {% if selected_level == "beginner" %}selected{% endif %}>Beginner</option>
            <option value="intermediate" {% if selected_level == "intermediate" %}selected{% endif %}>Intermediate</option>
            <option value="advanced" {% if selected_level == "advanced" %}selected{% endif %}>Advanced</option>
        </select>
        <button class="btn btn-outline-primary">Filter</button>
    </form>
</div>
<div class="row g-3">
    {% for course in courses %}
    <div class="col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <h5>{{ course.title }}</h5>
                <p class="text-muted">{{ course.description|truncatewords:20 }}</p>
                <span class="badge bg-secondary">{{ course.get_difficulty_level_display }}</span>
            </div>
            <div class="card-footer bg-white">
                <a href="{% url 'courses:detail' course.id %}" class="btn btn-primary btn-sm">View Course</a>
            </div>
        </div>
    </div>
    {% empty %}
    <p>No courses available.</p>
    {% endfor %}
</div>
{% endblock %}
