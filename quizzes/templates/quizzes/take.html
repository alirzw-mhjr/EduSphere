{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h3>Take Quiz</h3>
        {% if result %}
        <div class="alert alert-info">You already submitted this quiz. <a href="{% url 'quizzes:result' quiz_id %}">View result</a></div>
        {% endif %}
        <form id="quiz-form">
            {% csrf_token %}
            <div id="quiz-container"></div>
            <button type="submit" class="btn btn-primary mt-3">Submit Quiz</button>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const quizId = {{ quiz_id }};
const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

async function loadQuiz() {
  const res = await fetch(`/api/quizzes/${quizId}/`);
  const data = await res.json();
  const container = document.getElementById('quiz-container');
  container.innerHTML = data.questions.map((q, idx) => `
    <div class="mb-3 p-3 border rounded">
      <p><strong>${idx + 1}. ${q.text}</strong></p>
      <div class="form-check"><input class="form-check-input" type="radio" name="${q.id}" value="A"><label class="form-check-label">${q.option_a}</label></div>
      <div class="form-check"><input class="form-check-input" type="radio" name="${q.id}" value="B"><label class="form-check-label">${q.option_b}</label></div>
      ${q.option_c ? `<div class="form-check"><input class="form-check-input" type="radio" name="${q.id}" value="C"><label class="form-check-label">${q.option_c}</label></div>` : ''}
      ${q.option_d ? `<div class="form-check"><input class="form-check-input" type="radio" name="${q.id}" value="D"><label class="form-check-label">${q.option_d}</label></div>` : ''}
    </div>
  `).join('');
}

document.getElementById('quiz-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const answers = {};
  document.querySelectorAll('#quiz-container input[type=radio]:checked').forEach((input) => {
    answers[input.name] = input.value;
  });
  const res = await fetch(`/api/quizzes/${quizId}/submit/`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken},
    body: JSON.stringify({answers})
  });
  if (res.ok) {
    window.location.href = `/quizzes/${quizId}/result/`;
  }
});

loadQuiz();
</script>
{% endblock %}
